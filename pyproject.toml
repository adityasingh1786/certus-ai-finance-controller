[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certus-ai-finance-controller"
version = "1.0.0"
description = "Sovereign Autonomous Financial Controller & 3-Way Reconciliation System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aditya Singh", email = "adityasingh1786@gmail.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "rapidfuzz>=3.8.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "groq>=0.5.0",
    "google-generativeai>=0.5.0",
    "openai>=1.25.0",
    "anthropic>=0.25.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "black>=24.3.0"
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pyright]
include = ["backend"]
extraPaths = ["backend"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
src = ["backend"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ['py312']
