version: "3.8"

services:
  certus-controller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certus-ai-finance-controller
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - SQLITE_DB_PATH=/app/data/certus.db
      - CONFIDENCE_THRESHOLD=0.75
    volumes:
      - certus_data:/app/data
    restart: unless-stopped

volumes:
  certus_data:
    driver: local
